services:
  router:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - mixroute-data:/data
    # must exceed the server's 15s drain deadline so in-flight requests finish
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  mixroute-data:
